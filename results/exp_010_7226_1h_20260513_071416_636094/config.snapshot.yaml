name: exp_010_7226_1h
description: Lab experiment for 7226, a 2x leveraged Hang Seng Tech ETF, using 1-minute
  Futu data sampled at the 1-hour decision points.
seed: 42
inherits: _baseline.yaml
data:
  source: futu
  path: data/raw/HK_07226_1m.csv
  symbol: '7226'
  start: '2020-12-10'
  end: '2026-05-11'
  train_split: 0.7
market:
  capital: 1000000
  fee_bps_one_side: 20
  decision_times:
  - '10:30'
  - '11:30'
  - '13:30'
  - '14:30'
  - '15:30'
  force_close_time: '16:00'
  lot_size: 500
state:
  encoder: three_feature
  kwargs:
    thresholds:
      delta_close:
      - -0.027
      - 0.027
      delta_open:
      - -0.018
      - 0.018
      delta_prev:
      - -0.0144
      - 0.0144
reward:
  function: log_return
  kwargs: {}
agent:
  type: qtable
  kwargs:
    num_decision_points: 5
    num_states: 27
    num_actions: 2
    epsilon_start: 0.4
    epsilon_decay_per_episode: 0.98
    epsilon_min: 0.01
    alpha_mode: per_cell
    optimistic_init: 0.0
    tie_break: random
training:
  walk_forward:
    initial_train_days: 1000
    test_window_days: 250
  episodes_per_window: 5
evaluation:
  baselines:
  - random_binary
  - always_long
  - buy_and_hold
  compute_oracle: true
  feature_signal_check: true
artifacts:
  q_state_path: artifacts/q_state.pkl
  log_dir: artifacts/logs/
