name: exp_013_2800_30min_margin_long
description: Paper-trade-seeking 2800.HK M30 Q-table that prefers long when Q-values
  are close.
seed: 42
inherits: exp_012_2800_30min_trade_aggressive.yaml
data:
  source: csv
  path: data/raw/webull_2800_hk_m30.csv
  symbol: 2800.HK
  start: '2018-04-03'
  end: '2026-05-13'
  train_split: 0.7
market:
  capital: 1000000
  fee_bps_one_side: 20
  decision_times:
  - '10:00'
  - '10:30'
  - '11:00'
  - '11:30'
  - '13:30'
  - '14:00'
  - '14:30'
  - '15:00'
  - '15:30'
  force_close_time: '16:00'
  lot_size: 500
state:
  encoder: three_feature
  kwargs:
    thresholds:
      delta_close:
      - -0.0107142857
      - 0.0107142857
      delta_open:
      - -0.0071428571
      - 0.0071428571
      delta_prev:
      - -0.0057142857
      - 0.0057142857
reward:
  function: log_return_long_bias
  kwargs:
    beta: 0.00015
agent:
  type: qtable
  kwargs:
    num_decision_points: 9
    num_states: 27
    num_actions: 2
    epsilon_start: 0.8
    epsilon_decay_per_episode: 0.985
    epsilon_min: 0.1
    alpha_mode: per_cell
    optimistic_init: 0.005
    tie_break: long
    long_margin: 0.002
training:
  walk_forward:
    initial_train_days: 1000
    test_window_days: 250
  episodes_per_window: 25
evaluation:
  baselines:
  - random_binary
  - always_long
  - buy_and_hold
  compute_oracle: true
  feature_signal_check: true
artifacts:
  q_state_path: artifacts/q_state.pkl
  log_dir: artifacts/logs/
