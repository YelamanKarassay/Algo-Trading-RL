name: exp_002_2800_30min
description: Tier 2 grid cell for 2800.HK at 30-minute interval.
seed: 42
inherits: _baseline.yaml
data:
  source: csv
  path: data/raw/2800_hk_2018start_30min.csv
  symbol: 2800.HK
  start: '2026-05-04'
  end: '2026-05-08'
  train_split: 0.7
market:
  capital: 1000000
  fee_bps_one_side: 20
  decision_times:
  - '10:00'
  - '10:30'
  - '11:00'
  - '11:30'
  - '13:30'
  - '14:00'
  - '14:30'
  - '15:00'
  force_close_time: '15:30'
  lot_size: 500
state:
  encoder: three_feature
  kwargs:
    thresholds:
      delta_close:
      - -0.0107142857
      - 0.0107142857
      delta_open:
      - -0.0071428571
      - 0.0071428571
      delta_prev:
      - -0.0057142857
      - 0.0057142857
reward:
  function: log_return
  kwargs: {}
agent:
  type: qtable
  kwargs:
    num_decision_points: 8
    num_states: 27
    num_actions: 2
    epsilon_start: 0.4
    epsilon_decay_per_episode: 0.98
    epsilon_min: 0.01
    alpha_mode: per_cell
    optimistic_init: 0.0
    tie_break: random
training:
  walk_forward:
    initial_train_days: 1000
    test_window_days: 250
  episodes_per_window: 5
evaluation:
  baselines:
  - random_binary
  - always_long
  - buy_and_hold
  compute_oracle: true
  feature_signal_check: true
artifacts:
  q_state_path: artifacts/q_state.pkl
  log_dir: artifacts/logs/
